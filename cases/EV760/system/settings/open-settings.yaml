# 真机冒烟用例（project-scoped-case-execution 入口验证，非业务验收）：打开系统设置并检查主页面。
# 步骤蓝本为 examples/workbench/settings-bluetooth.android.yaml（同机型 HC100 真机验证通过）。
beforeEach:
  - device.prepare:
      target: home
afterEach:
  - device.recover: {}
cases:
  - name: 打开设置并检查主页面
    steps:
      - launch:
          uri: com.android.settings
      - wait:
          duration: 500
      - aiAssert:
          prompt: 当前页面是系统设置的主页面。
      - aiAssert:
          prompt: 屏幕上存在“蓝牙”开关或“蓝牙”选项。
      - terminate:
          uri: com.android.settings
