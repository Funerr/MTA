# 真机冒烟用例（project-scoped-case-execution 入口验证，非业务验收）：进入蓝牙页面并检查开关。
beforeEach:
  - device.prepare:
      target: home
afterEach:
  - device.recover: {}
cases:
  - name: 进入蓝牙页面并检查开关
    steps:
      - launch:
          uri: com.android.settings
      - wait:
          duration: 500
      - aiAct: 在设置中找到并进入蓝牙页面
      - wait:
          duration: 500
      - aiAssert:
          prompt: 当前页面是蓝牙设置页面，可以看到蓝牙开关。
      - terminate:
          uri: com.android.settings
