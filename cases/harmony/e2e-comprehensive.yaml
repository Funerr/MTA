# yaml-language-server: $schema=../../schemas/midscene-workflow.schema.json
cases:
  # ═══════════════════════════════════════════════════════════════
  # 1. 设备生命周期与系统导航
  # ═══════════════════════════════════════════════════════════════
  - name: 设备生命周期与系统导航
    steps:
      - device.prepare:
          target: home
      - home: {}
      - wait:
          duration: 500
      - aiAssert:
          prompt: 当前在主屏幕或桌面
      - back: {}
      - wait:
          duration: 500
      - home: {}
      - wait:
          duration: 500
      - recentApps: {}
      - wait:
          duration: 1000
      - aiAssert:
          prompt: 当前显示的是最近任务或多任务界面
      - home: {}
      - wait:
          duration: 500
      - device.recover: {}

  # ═══════════════════════════════════════════════════════════════
  # 2. 应用启动与终止（launch / terminate）
  # ═══════════════════════════════════════════════════════════════
  - name: 应用启动与终止 - 设置
    steps:
      - device.prepare:
          target: home
      - launch:
          uri: com.huawei.hmos.settings
      - wait:
          duration: 2000
      - aiAssert:
          prompt: 当前打开了设置应用，可以看到设置选项列表
      - terminate:
          uri: com.huawei.hmos.settings
      - wait:
          duration: 1000
      - aiAssert:
          prompt: 当前不在设置应用内
      - device.recover: {}

  - name: 应用启动与终止 - 计算器
    steps:
      - device.prepare:
          target: home
      - launch:
          uri: com.huawei.hmos.calculator
      - wait:
          duration: 2000
      - aiAssert:
          prompt: 当前打开了计算器应用，可以看到数字按钮
      - terminate:
          uri: com.huawei.hmos.calculator
      - wait:
          duration: 1000
      - device.recover: {}

  # ═══════════════════════════════════════════════════════════════
  # 3. HDC Shell 命令执行
  # ═══════════════════════════════════════════════════════════════
  - name: HDC Shell 系统信息查询
    steps:
      - device.prepare:
          target: home
      - runHdcShell:
          command: "uname -a"
      - runHdcShell:
          command: "cat /etc/version.conf | head -5"
      - runHdcShell:
          command: "df -h /data"
      - runHdcShell:
          command: "free -h"
      - device.recover: {}

  - name: HDC Shell 应用管理
    steps:
      - device.prepare:
          target: home
      - runHdcShell:
          command: "bm dump -a | wc -l"
      - runHdcShell:
          command: "aa dump | head -10"
      - device.recover: {}

  # ═══════════════════════════════════════════════════════════════
  # 4. AI 视觉理解能力（aiAssert / aiTap）
  # ═══════════════════════════════════════════════════════════════
  - name: AI 视觉断言 - 主屏幕元素识别
    steps:
      - device.prepare:
          target: home
      - home: {}
      - wait:
          duration: 1000
      - aiAssert:
          prompt: 屏幕上有时钟或时间显示
      - aiAssert:
          prompt: 屏幕上有应用图标或快捷方式
      - aiAssert:
          prompt: 屏幕底部有导航栏或Dock栏
      - device.recover: {}

  - name: AI 视觉操作 - 计算器交互（含清空）
    steps:
      - device.prepare:
          target: home
      - launch:
          uri: com.huawei.hmos.calculator
      - wait:
          duration: 2000
      # 先清空计算器历史
      - aiTap:
          prompt: AC 或 C 或 清除按钮
      - wait:
          duration: 500
      - aiTap:
          prompt: 数字 1 按钮
      - wait:
          duration: 300
      - aiTap:
          prompt: 加号按钮
      - wait:
          duration: 300
      - aiTap:
          prompt: 数字 2 按钮
      - wait:
          duration: 300
      - aiTap:
          prompt: 等号按钮
      - wait:
          duration: 500
      - aiAssert:
          prompt: 计算结果显示为 3
      - terminate:
          uri: com.huawei.hmos.calculator
      - device.recover: {}

  # ═══════════════════════════════════════════════════════════════
  # 5. AI 自然语言操作（aiAct）- 简化任务避免超时
  # ═══════════════════════════════════════════════════════════════
  - name: AI 自然语言操作 - 简单滑动
    steps:
      - device.prepare:
          target: home
      - launch:
          uri: com.huawei.hmos.settings
      - wait:
          duration: 2000
      - aiAct:
          prompt: 向下滑动一点
          $:
            timeout: 30000
      - wait:
          duration: 1000
      - terminate:
          uri: com.huawei.hmos.settings
      - device.recover: {}

  # ═══════════════════════════════════════════════════════════════
  # 6. 记录到报告（recordToReport）
  # ═══════════════════════════════════════════════════════════════
  - name: 报告记录功能
    steps:
      - device.prepare:
          target: home
      - home: {}
      - wait:
          duration: 1000
      - recordToReport:
          title: 测试开始截图
          options:
            content: 这是端到端测试的起始状态截图
      - launch:
          uri: com.huawei.hmos.clock
      - wait:
          duration: 2000
      - recordToReport:
          title: 时钟应用截图
          options:
            content: 成功打开时钟应用
      - terminate:
          uri: com.huawei.hmos.clock
      - device.recover: {}

  # ═══════════════════════════════════════════════════════════════
  # 7. 经验动作（experienceAct）- 回退到 aiAct
  # ═══════════════════════════════════════════════════════════════
  - name: 经验动作回退测试
    steps:
      - device.prepare:
          target: home
      - home: {}
      - wait:
          duration: 1000
      # experienceAct 未登记目标会回退到原生 aiAct
      - experienceAct:
          prompt: 点击屏幕上的时钟或时间显示区域
      - wait:
          duration: 1000
      - device.recover: {}

  # ═══════════════════════════════════════════════════════════════
  # 8. 复杂场景 - 多应用切换
  # ═══════════════════════════════════════════════════════════════
  - name: 多应用切换与状态验证
    steps:
      - device.prepare:
          target: home
      # 打开设置
      - launch:
          uri: com.huawei.hmos.settings
      - wait:
          duration: 2000
      - aiAssert:
          prompt: 当前在设置应用中
      # 回到主屏幕
      - home: {}
      - wait:
          duration: 500
      # 打开日历
      - launch:
          uri: com.huawei.hmos.calendar
      - wait:
          duration: 2000
      - aiAssert:
          prompt: 当前在日历应用中
      # 使用最近任务切换
      - recentApps: {}
      - wait:
          duration: 1000
      - aiAssert:
          prompt: 可以看到最近打开的应用列表
      # 回到主屏幕并清理
      - home: {}
      - wait:
          duration: 500
      - terminate:
          uri: com.huawei.hmos.settings
      - terminate:
          uri: com.huawei.hmos.calendar
      - device.recover: {}